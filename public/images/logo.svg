<svg viewBox="0 0 900 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0C4A6E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hexagon with pulse and person icon -->
  <g transform="translate(15, 20)">
    <!-- Outer hexagon -->
    <path d="M50 5 L85 25 L85 65 L50 85 L15 65 L15 25 Z" stroke="url(#hexGrad)" stroke-width="3.5" fill="none"/>
    <!-- Inner hexagon -->
    <path d="M50 15 L75 30 L75 60 L50 75 L25 60 L25 30 Z" stroke="#22D3EE" stroke-width="2" fill="none" opacity="0.4"/>
    
    <!-- Pulse line -->
    <path d="M20 45 L35 45 L40 35 L45 55 L50 40 L55 45 L80 45" stroke="#0EA5E9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Person icon (simplified) -->
    <circle cx="50" cy="32" r="6" fill="#0C4A6E"/>
    <path d="M38 60 Q38 48 50 48 Q62 48 62 60" stroke="#0C4A6E" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- SKINEXPERT text -->
  <g transform="translate(130, 70)">
    <!-- SKIN (darker blue) -->
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="48" font-weight="700" fill="#0C4A6E">SKIN</text>
    <!-- EXPERT (lighter blue) -->
    <text x="145" y="0" font-family="'Poppins', sans-serif" font-size="48" font-weight="400" fill="#22D3EE">EXPERT</text>
  </g>
  
  <!-- Tagline -->
  <text x="132" y="95" font-family="'Poppins', sans-serif" font-size="11" font-weight="400" fill="#64748B" letter-spacing="1.5">SISTEM PAKAR PENYAKIT KULIT</text>
</svg>
